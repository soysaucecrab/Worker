# hud 설정 (~/.hud/config.toml, 버전 1)
# 바꾼 뒤 hud를 다시 실행하면 적용돼요. 자세한 내용은 SPEC 8장.

version = 1

[general]
notification_hours = 48            # 몇 시간 전 알림까지 볼지
show_other_apps = false            # 아래 [[apps]]에 없는 앱의 알림도 '전체' 피드에 보일지
calendar_days = 3                  # 오늘부터 며칠치 일정을 볼지
exclude_calendars = ["생일", "Birthdays", "Siri Suggestions"]
exclude_reminder_lists = []
theme = "ansi-dark"                # 터미널 색을 그대로 씀

# ── 감시할 앱 ──
# 나열한 순서가 트리 순서예요.
# process    : Dock 배지를 읽고 앱을 열 때 쓰는 이름. 비우면 배지를 안 읽어요
# bundle_ids : 알림 센터에서 이 앱을 찾을 번들 ID. * 와일드카드 가능 (hud --doctor로 확인)
# match      : 알림을 이 소스/하위 항목으로 분류하는 규칙. { title = "..." } 또는 { any = "re:..." }
# only_children : true면 어떤 하위 항목에도 안 걸린 알림을 버려요 (지정 방만 보기)
# color      : red, green, yellow, blue, magenta, cyan, bright_magenta, "#5865F2" 등

[[apps]]
name = "Slack"
process = "Slack"
bundle_ids = ["com.tinyspeck.slackmacgap"]
color = "magenta"
sender = "title"

[[apps]]
name = "카카오톡"
process = "KakaoTalk"
bundle_ids = ["com.kakao.KakaoTalkMac"]
color = "yellow"
only_children = true
sender = "body_prefix"             # --dump 결과를 보고 확정 (SPEC 16장 Q1)

  [[apps.children]]
  name = "학생회 집행부"
  match = { title = "학생회 집행부" }

  [[apps.children]]
  name = "랩 동기방"
  match = { title = "랩 동기방" }

[[apps]]
name = "Discord"
process = "Discord"
bundle_ids = ["com.hnc.discord"]
color = "blue"
only_children = true

  [[apps.children]]
  name = "#운영진"
  match = { title = "#운영진" }
  # url = "discord://-/channels/<서버ID>/<채널ID>"   # 선택. 동작 확인 필요
  # channel_id = "123456789"                        # Discord 봇을 쓸 때 (M4)

[[apps]]
name = "GroovSide"
process = "GroovSide"
bundle_ids = []                    # hud --doctor 결과를 보고 채우세요
color = "cyan"
only_children = false              # 구분 안 되는 알림은 '기타'로

  [[apps.children]]
  name = "Instagram"
  match = { any = "instagram" }

  [[apps.children]]
  name = "Threads"
  match = { any = "threads" }

  [[apps.children]]
  name = "X"
  match = { any = "re:\\bx\\.com\\b|\\btwitter\\b" }

[[apps]]
name = "Instagram"
process = ""                       # 브라우저로 쓰면 배지가 없어요
bundle_ids = ["com.google.Chrome", "com.apple.Safari", "com.apple.Safari.WebApp.*"]
match = { any = "instagram" }
url = "https://www.instagram.com/direct/inbox/"
color = "bright_magenta"

[[apps]]
name = "iCampus"
kind = "icampus"
color = "green"

[icampus]
enabled = true
base_url = "https://canvas.skku.edu"
keychain_service = "hud.icampus"
poll_minutes = 10
days_ahead = 14
show_done_days = 1

[discord_bot]
enabled = false
keychain_service = "hud.discord"
poll_seconds = 60
